<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>HR Chatbot – Khối Nhân sự & Trải nghiệm Nơi làm việc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f3d2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 420px;
      max-width: 95%;
      height: 600px;
      background: #ffffff;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .chat-header {
      background: #1e7f5c;
      color: #fff;
      padding: 16px;
      font-weight: bold;
      text-align: center;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f4f7f6;
    }

    .message {
      margin-bottom: 12px;
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 14px;
      word-wrap: break-word;
    }

    .user {
      background: #1e7f5c;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: #e0e0e0;
      color: #000;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      padding: 14px;
      border: none;
      font-size: 14px;
      outline: none;
    }

    .chat-input button {
      padding: 0 20px;
      border: none;
      background: #1e7f5c;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .chat-input button:hover {
      background: #16624a;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <div class="chat-header">
      PHS Buddy Nhân sự
    </div>

    <div class="chat-messages" id="messages">
      <div class="message bot">
        👋 Xin chào PHSer! Tôi là Trợ lý AI của Khối Nhân sự & Trải nghiệm Nơi làm việc.  
        Bạn cần hỗ trợ vấn đề gì?
      </div>
    </div>

    <div class="chat-input">
      <input
        type="text"
        id="input"
        placeholder="Nhập câu hỏi của bạn..."
        autocomplete="off"
      />
      <button onclick="sendMessage()">Gửi</button>
    </div>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "message " + sender;
      div.innerText = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      // Hiển thị trạng thái đang trả lời
      const loading = document.createElement("div");
      loading.className = "message bot";
      loading.innerText = "⏳ Đang trả lời...";
      messages.appendChild(loading);
      messages.scrollTop = messages.scrollHeight;

try {
  const res = await fetch("https://n8n.phs.vn/webhook/hrchat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: text
    })
  });

  const data = await res.json();
  loading.remove();

  const botReply =
    data.reply ||
    data.output ||
    data.message ||
    "⚠️ Không có phản hồi từ hệ thống.";

  addMessage(botReply, "bot");

} catch (err) {
  loading.remove();
  addMessage("❌ Lỗi kết nối tới hệ thống. Vui lòng thử lại.", "bot");
}

    }

    // Gửi bằng Enter
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
