<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>PW Chatbot – Khối Nhân sự & Trải nghiệm Nơi làm việc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f3d2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
    }

    /* ===== Logo công ty ===== */
    .company-logo {
      position: absolute;
      top: 30px;
      left: 50px;
    }

    .company-logo img {
      height: 90px;
    }

    /* ===== Chat container ===== */
    .chat-container {
      width: 650px;          /* Mở rộng hơn */
      max-width: 95%;
      height: 720px;         /* Cao hơn */
      background: #ffffff;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
      overflow: hidden;
    }

    .chat-header {
  background: #1e7f5c;
  color: #fff;
  padding: 22px 20px 26px 20px; /* tăng chiều cao */
  text-align: center;
}

/* Dòng tiêu đề chính */
.chat-header .title {
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 6px;
}

/* 2 dòng mô tả */
.chat-header .subtitle {
  font-style: italic;
  font-size: 15px; /* bằng cỡ chữ tin nhắn bot */
  line-height: 1.5;
}


    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f4f7f6;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin-bottom: 14px;
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
    }

    .user {
      background: #1e7f5c;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 6px;
    }

    .bot {
      background: #e0e0e0;
      color: #000;
      align-self: flex-start;
      border-bottom-left-radius: 6px;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      padding: 16px;
      border: none;
      font-size: 15px;
      outline: none;
    }

    .chat-input button {
      padding: 0 28px;
      border: none;
      background: #1e7f5c;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .chat-input button:hover {
      background: #16624a;
    }

    /* Responsive cho màn hình nhỏ */
    @media (max-width: 768px) {

  body {
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 20px;
  }

  /* Logo mobile */
  .company-logo {
    position: static;      /* bỏ absolute */
    margin-bottom: 10px;
  }

  .company-logo img {
    height: 60px;
  }

  /* Chat mobile */
  .chat-container {
    width: 95%;
    height: 85vh;
  }
  .chat-header .subtitle {
    font-size: 12px;   /* nhỏ lại chỉ trên mobile */
    line-height: 1.4;
  }

}

  </style>
</head>

<body>

  <!-- Logo công ty -->
  <div class="company-logo">
    <img src="logophs.png" alt="Company Logo">
  </div>

  <div class="chat-container">

    <div class="chat-header">
  <div class="title">
    PHS Buddy Nhân sự
  </div>
  <div class="subtitle">
    Trợ lý Khối Nhân sự và Trải nghiệm nơi làm việc<br>
    Đồng hành cùng bạn trên hành trình làm việc tại PHS
  </div>
</div>


    <div class="chat-messages" id="messages">
      <div class="message bot">
        👋 Xin chào PHSer! Tôi là Trợ lý AI của Khối Nhân sự & Trải nghiệm Nơi làm việc.  
        Bạn cần hỗ trợ vấn đề gì?
      </div>
    </div>

    <div class="chat-input">
      <input
        type="text"
        id="input"
        placeholder="Nhập câu hỏi của bạn..."
        autocomplete="off"
      />
      <button onclick="sendMessage()">Gửi</button>
    </div>

  </div>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "message " + sender;
      div.innerText = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      const loading = document.createElement("div");
      loading.className = "message bot";
      loading.innerText = "⏳ Đang trả lời...";
      messages.appendChild(loading);
      messages.scrollTop = messages.scrollHeight;

      try {
        const res = await fetch("https://n8n.phs.vn/webhook/hrchat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await res.json();
        loading.remove();

        const botReply =
          data.reply ||
          data.output ||
          data.message ||
          "⚠️ Không có phản hồi từ hệ thống.";

        addMessage(botReply, "bot");

      } catch (err) {
        loading.remove();
        addMessage("❌ Lỗi kết nối tới hệ thống. Vui lòng thử lại.", "bot");
      }
    }

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
